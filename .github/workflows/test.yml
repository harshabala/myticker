name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Syntax and manifest checks
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Version consistency
        run: npm run check:version
      - name: Sensitive-content scan
        run: npm run scan
      - name: Test suite
        run: npm test
      - name: Dependency audit
        run: npm run audit:deps
      - name: Package extension
        run: npm run package

  smoke:
    # Loads the unpacked extension in Chrome for Testing (branded Chrome
    # ignores --load-extension) with outside hosts blocked; see CONTRIBUTING.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
      - name: Install Chrome for Testing
        run: echo "CHROME_PATH=$(npx --yes @puppeteer/browsers@3.2.3 install chrome@stable --path "$RUNNER_TEMP/browsers" --format '{{path}}')" >> "$GITHUB_ENV"
      - name: Browser smoke test
        run: npm run smoke
        env:
          SMOKE_OUT: ${{ runner.temp }}/smoke
      - name: Keep screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-screenshots
          path: ${{ runner.temp }}/smoke
